<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简历轻填 · 资料管理</title><link rel="stylesheet" href="ui.css"></head><body><main class="editor">
<header class="row between"><div class="brand"><div class="logo">填</div><div><h1>一份资料，少填很多次。</h1><p class="muted">简历轻填 / 个人资料管理</p></div></div><span class="badge">LOCAL FIRST · 本机存储</span></header>
<div class="layout"><aside class="sidebar card"><h3>我的简历</h3><select id="profiles" aria-label="选择简历" style="margin-top:16px"></select><button id="new">＋ 新建简历</button><button id="duplicate">复制这份简历</button><button id="export">导出 JSON 备份</button><label class="file-label">导入 JSON 备份<input id="import" type="file" accept=".json,application/json"></label><button id="delete" class="quiet danger">删除这份简历</button><p class="muted" style="margin-top:22px">资料只保存在当前浏览器本机。卸载插件会清除资料，请定期导出备份。填写时仅把所选资料写入当前网页。</p></aside>
<div><section class="card section"><div class="row between section-head"><h2>简历版本</h2><span class="badge">按岗位准备不同版本</span></div><label><span>版本名称</span><input id="title" placeholder="例如：产品经理 / 校招"></label></section>
<section class="card section"><div class="section-head"><h2>基本资料</h2><p class="muted">空白字段会自动跳过。日期请用 YYYY-MM-DD 格式。</p></div><div id="basics" class="grid"></div></section>
<div id="groups"></div>
<div class="note">使用方法：保存资料 → 打开任意招聘表单 → 点击浏览器工具栏的「简历轻填」→ 识别当前页面 → 核对并填写。多条经历存在歧义时，请在插件里选对应条目；插件不会自动新增网页中的经历表单。</div>
<div class="savebar"><span id="status" class="status" role="status" aria-live="polite">资料不会上传到服务器。</span><button id="save" class="primary">保存全部资料</button></div></div></div></main><script src="core.js"></script><script src="core/profile/schema.js"></script><script src="core/matcher/scoring.js"></script><script src="default-profile.js"></script><script src="core/profile/updates.js"></script><script src="options.js"></script></body></html>
