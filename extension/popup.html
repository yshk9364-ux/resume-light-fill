<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简历轻填</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
<header class="popup-header"><div class="brand"><div class="logo">填</div><div><h1>简历轻填</h1><p class="popup-subtitle">选择资料，一键填写当前网页</p></div></div><button id="closePopup" class="text-button" aria-label="关闭插件窗口">关闭</button></header>
<main>
  <section class="popup-step" aria-labelledby="profileHeading">
    <div class="step-title"><span class="step-number">1</span><h2 id="profileHeading">选择简历</h2><button id="manage" class="text-button">管理资料</button></div>
    <label class="sr-only" for="profiles">简历资料</label><select id="profiles" aria-label="本次使用的简历"></select>
  </section>
  <section class="popup-step" aria-labelledby="scopeHeading">
    <div class="step-title"><span class="step-number">2</span><h2 id="scopeHeading">选择填写范围</h2></div>
    <label class="sr-only" for="scopeGroup">填写哪部分</label>
    <select id="scopeGroup"><option value="all">当前页面全部资料</option><option value="basics">个人信息</option></select>
    <div id="recordControls" class="record-controls"><label for="scopeRecord">使用哪一条资料</label><div class="record-row"><select id="scopeRecord"></select><button id="nextRecord" class="compact-button">下一条</button></div></div>
    <p id="selectionHint" class="selection-hint">填写当前页面可识别的全部资料。</p>
  </section>
  <section class="popup-step action-step" aria-labelledby="actionHeading">
    <div class="step-title"><span class="step-number">3</span><h2 id="actionHeading">填写并查看结果</h2></div>
    <button id="quickFill" class="primary main-action">填写当前表单</button>
    <label class="check save-option"><input id="closeModal" type="checkbox" checked><span>成功后保存并关闭网站表单</span></label>
  </section>
  <div id="status" role="status" aria-live="polite" class="status-card">打开网申表单后，点击“填写当前表单”。</div>
  <div class="diagnostic-row"><button id="copyError" class="text-button">复制当前情况给 AI</button><span id="copyHint" class="muted" hidden></span></div>
  <button id="results" class="result-action">查看网页填写结果 <span aria-hidden="true">→</span></button>
  <details id="moreActions" class="popup-disclosure"><summary>需要调整字段或使用更多操作？</summary>
    <div class="advanced-content">
      <p class="muted">填写不准确时，可先识别字段，再逐项调整对应资料。</p>
      <div class="advanced-actions"><button id="scan">识别并核对字段</button><button id="expand">自动新增缺少记录</button><button id="undo">撤销填写</button></div>
      <button id="applyRecord" class="secondary-action">重新识别当前条目</button>
      <label class="check"><input type="checkbox" id="overwrite" checked><span>覆盖网页已有内容</span></label>
      <details id="reviewPanel" class="popup-disclosure review-disclosure"><summary>逐字段核对与调整</summary><div id="fields" class="fields"></div><button id="fill" class="primary secondary-action" disabled>填写已匹配字段</button></details>
    </div>
  </details>
</main>
<script src="core.js"></script><script src="core/profile/schema.js"></script><script src="core/matcher/scoring.js"></script><script src="default-profile.js"></script><script src="core/profile/updates.js"></script><script src="popup.js"></script>
</body></html>
